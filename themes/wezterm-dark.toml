# %LOCALAPPDATA%\rio\themes\wezterm-dark.toml
# Used when Windows is in DARK mode: true black (OLED-friendly).
# Port of ~/.config/wezterm/palette.lua (`dark` variant).

[colors]
background = "#000000"
foreground = "#d6d6d6"
cursor     = "#8b8d94"
vi-cursor  = "#7aa2f7"

selection-background = "#283457"
selection-foreground = "#ffffff"

# Tab strip text: inactive = dim slate, active = accent (WezTerm's active tab)
tabs        = "#6b7089"
tabs-active = "#7aa2f7"

# Split dividers: inactive = muted slate, focused = accent
split        = "#2a2d3a"
split-active = "#7aa2f7"

search-match-background         = "#e0af68"
search-match-foreground         = "#15161d"
search-focused-match-background = "#ff9e64"
search-focused-match-foreground = "#15161d"

hint-background = "#7aa2f7"
hint-foreground = "#15161d"

# ANSI 0-7
black   = "#1b1d27"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

# ANSI 8-15 (brights)
light-black   = "#414868"
light-red     = "#ff7a93"
light-green   = "#b9f27c"
light-yellow  = "#ff9e64"
light-blue    = "#7da6ff"
light-magenta = "#bb9af7"
light-cyan    = "#0db9d7"
light-white   = "#c0caf5"
